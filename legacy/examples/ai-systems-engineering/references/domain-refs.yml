# ============================================================
# DOMAIN REFERENCES
# AI Systems Engineering — Instancia Pedagógica
# ============================================================
# Corpus de referencias del dominio organizado por sección.
# Tres niveles de uso:
#   - evaluacion: calibrar profundidad y cobertura de capítulos
#   - lector: aparecer en referencias del capítulo publicado
#   - ambos: los dos usos anteriores
#
# Estado de verificación:
#   - verificado: URL confirmada y recurso accesible
#   - pendiente: identificado pero sin verificar
#   - post-cutoff: puede existir versión más reciente
#
# Este fichero se construye progresivamente.
# Generado en Phase 0 — Inception como hipótesis inicial.
# Enriquecer durante Phase 2 y Phase 4.
# ============================================================

meta:
  version: v0
  generado_en: phase-0-inception
  fecha: 2026-03-10
  cobertura: por-seccion
  tipos_incluidos:
    - papers-academicos-fundacionales
    - libros-tecnicos-referencia
    - documentacion-oficial-frameworks
    - engineering-blogs-empresas-referencia
  nota: >
    Todas las URLs requieren verificación antes de incluir
    en capítulos publicados. Ver ai-usage-policy.yml para
    política de verificación de referencias.

